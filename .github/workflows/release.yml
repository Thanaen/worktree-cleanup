name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify package contents
        run: |
          package_dir="$(mktemp -d)"
          package_json="$(npm pack --pack-destination "$package_dir" --json)"
          jq --exit-status '
            .[0].files | map(.path) as $files |
            all(
              "dist/main.mjs",
              "dist/index.mjs",
              "dist/index.d.mts";
              . as $required | $files | index($required) != null
            )
          ' <<< "$package_json"
          package_file="$(jq --raw-output '.[0].filename' <<< "$package_json")"
          tar --extract --to-stdout --file "$package_dir/$package_file" package/package.json |
            jq --exit-status '
              .bin["worktree-clean"] == "dist/main.mjs" and
              .bin["worktree-cleanup"] == "dist/main.mjs" and
              .exports["."].import == "./dist/index.mjs" and
              .exports["."].types == "./dist/index.d.mts"
            '
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
